# native-image settings for nix-truffle (see bin/build-native). reachability-metadata.json was
# recorded with the tracing agent while running the tests (-agentlib:native-image-agent).
# EvalThread is initialized at run time: its SINGLE_THREADED assumption, made while building the
# image, wasn't invalidated for code in the image when evaluation workers started, and two threads
# could then evaluate a thunk at once.
Args = -H:+UnlockExperimentalVMOptions -H:+ForeignAPISupport -H:-UnlockExperimentalVMOptions \
       --enable-native-access=ALL-UNNAMED \
       --initialize-at-build-time=nixtruffle \
       --initialize-at-run-time=nixtruffle.fs.Fs,nixtruffle.launcher,nixtruffle.runtime.EvalThread,nixtruffle.builtins.WasmBuiltin$Wasi,nixtruffle.fetch.Download
